<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delicious Library Shared</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#2b2118;color:#eee}
header{background:#1a120b;padding:10px 16px;display:flex;gap:10px;align-items:center;border-bottom:3px solid #c89b4a;flex-wrap:wrap}
header h1{margin:0;font-size:20px;color:#f5d78e;font-style:italic}
header .sp{flex:1}
button,input,select,textarea{font-family:inherit;font-size:13px}
button{background:#c89b4a;border:2px outset #f5d78e;padding:5px 12px;cursor:pointer;color:#221610;font-weight:bold}
button:active{border-style:inset}button.ghost{background:#4a3826;color:#f5d78e;border-color:#c89b4a}
input,select,textarea{background:#fff8ec;border:2px inset #c89b4a;padding:5px;margin:2px}
nav{display:flex;gap:4px;padding:8px 16px;background:#3a2b1d}
nav button.on{background:#f5d78e}
main{padding:12px 16px;max-width:1000px;margin:0 auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.card{background:linear-gradient(#fffdf5,#f3e7c8);color:#221610;border-radius:4px;padding:10px;box-shadow:3px 3px 0 rgba(0,0,0,.5);position:relative}
.cover{height:90px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;color:#fff;text-shadow:1px 1px 0 #000;margin-bottom:6px}
.card h3{margin:0 0 2px;font-size:14px}.card p{margin:2px 0;font-size:12px;color:#555}
.stars{color:#b8860b}.badge{position:absolute;top:6px;right:6px;font-size:10px;background:#221610;color:#f5d78e;padding:1px 6px;border-radius:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
#auth{max-width:340px;margin:40px auto;background:#3a2b1d;padding:18px;border:3px solid #c89b4a}
#auth h2{color:#f5d78e;margin-top:0}
.hidden{display:none}.muted{color:#b9a071;font-size:12px}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#3a2b1d;padding:10px;border:2px solid #c89b4a;margin-bottom:8px}
form.grid .full{grid-column:1/-1}
</style>
</head>
<body>
<header>
<h1>📚 Delicious Library <small style="font-size:12px">Shared</small></h1><span class="sp"></span>
<span id="who" class="muted"></span>
<button id="logout" class="ghost hidden">log out</button>
</header>
<div id="auth">
<h2 id="atitle">Log in</h2>
<input id="aname" placeholder="username" maxlength="24">
<input id="apass" type="password" placeholder="password">
<div class="row"><button id="go">Log in</button><button id="swap" class="ghost">need an account? register</button></div>
<div class="row"><button id="bypass" class="ghost">⚠ BYPASS AUTHENTICATION (DEBUG ONLY)</button></div>
<p class="muted">Homage to Delicious Library (Delicious Monster, 2005). Register, catalog books/movies/music/games, share shelves publicly.</p>
</div>
<div id="app" class="hidden">
<nav>
<button data-t="mine" class="on">My Library</button>
<button data-t="add">+ Add</button>
<button data-t="find">Discover</button>
</nav>
<main>
<section id="t-mine">
<div class="row"><input id="q" placeholder="search title / creator / shelf" style="flex:1">
<select id="qf" style="width:130px"><option value="">all media</option><option>book</option><option>movie</option><option>music</option><option>game</option></select>
<button id="qs">Search</button></div>
<div id="mine" class="shelf"></div>
</section>
<section id="t-add" class="hidden">
<form class="grid" id="addf">
<input name="title" class="full" placeholder="Title *" required>
<input name="creator" placeholder="Author / Artist / Studio">
<input name="year" placeholder="Year" maxlength="8">
<select name="kind"><option>book</option><option>movie</option><option>music</option><option>game</option></select>
<select name="rating"><option value="0">★ unrated</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<input name="shelf" placeholder="Shelf (e.g. Sci-Fi)">
<label class="muted"><input type="checkbox" name="pub" checked style="width:auto"> public — visible to everyone</label>
<textarea name="notes" class="full" rows="2" placeholder="Notes"></textarea>
<button class="full">Add to my library</button>
</form>
</section>
<section id="t-find" class="hidden">
<div class="row"><input id="fq" placeholder="search everyone's public shelves…" style="flex:1">
<select id="ff" style="width:130px"><option value="">all media</option><option>book</option><option>movie</option><option>music</option><option>game</option></select>
<button id="fs">Search</button></div>
<div id="found" class="shelf"></div>
</section>
</main>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const api=(m,p,b)=>fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
let user=null,mode='login';
const PAL=[['#7b2d26','#c1666b'],['#2d4a7b','#6b9dc1'],['#2d6b34','#7bc186'],['#6b5a2d','#c1a86b'],['#4a2d6b','#a86bc1']];
const EMO={book:'📕',movie:'🎬',music:'💿',game:'🎮'};
function cover(it){const h=[...it.title].reduce((a,c)=>a+c.charCodeAt(0),0);const c=PAL[h%PAL.length];
 return `<div class="cover" style="background:linear-gradient(135deg,${c[0]},${c[1]})">${EMO[it.kind]||'📕'}</div>`;}
function stars(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);}
function card(it,mine){
 const d=document.createElement('div');d.className='card';
 d.innerHTML=`<span class="badge">${it.kind}${mine?(it.pub?' • public':' • private'):''}</span>${cover(it)}
 <h3></h3><p></p><p class="stars">${stars(it.rating||0)}</p>
 <p>${[it.shelf,it.year].filter(Boolean).join(' • ')}</p>
 ${it.notes?'<p><i></i></p>':''}${mine?'<div class="row"><button data-a="tog">make '+(it.pub?'private':'public')+'</button><button data-a="del">remove</button></div>':`<p>on <b><a href="#" data-u="${it.owner}">${it.owner}</a>'s shelf</b></p>`}`;
 d.querySelector('h3').textContent=it.title;d.querySelectorAll('p')[0].textContent=it.creator||'—';
 if(it.notes)d.querySelector('i').textContent=it.notes;
 if(mine){d.querySelector('[data-a=tog]').onclick=()=>api('PUT','/api/items/'+it.id,{...it,pub:it.pub?0:1}).then(loadMine);
  d.querySelector('[data-a=del]').onclick=()=>confirm('Remove "'+it.title+'"?')&&api('DELETE','/api/items/'+it.id).then(loadMine);}
 else d.querySelector('[data-u]').onclick=e=>{e.preventDefault();openUser(it.owner);};
 return d;}
async function refresh(){
 const r=await api('GET','/api/me');user=r.user;
 $('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);
 $('logout').classList.toggle('hidden',!user);$('who').textContent=user?('shelving as '+user.name):'';
 if(user)loadMine();}
$('swap').onclick=()=>{mode=mode==='login'?'register':'login';$('atitle').textContent=mode==='login'?'Log in':'Register';$('go').textContent=mode==='login'?'Log in':'Register';$('swap').textContent=mode==='login'?'need an account? register':'have an account? log in';};
$('go').onclick=async()=>{
 const r=await api('POST','/api/'+mode,{name:$('aname').value.trim(),pass:$('apass').value});
 if(r.error)return alert(r.error);$('apass').value='';refresh();};
$('logout').onclick=()=>api('POST','/api/logout').then(refresh);
$('bypass').onclick=()=>api('POST','/api/debug-bypass').then(refresh);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 ['mine','add','find'].forEach(t=>$('t-'+t).classList.add('hidden'));$('t-'+b.dataset.t).classList.remove('hidden');
 if(b.dataset.t==='find')discover();});
async function loadMine(){
 const p=new URLSearchParams({q:$('q').value});if($('qf').value)p.set('kind',$('qf').value);
 const r=await api('GET','/api/items?'+p);
 $('mine').innerHTML=r.items.length?'':'<p class="muted">Empty shelf — add something above.</p>';
 r.items.forEach(it=>$('mine').appendChild(card(it,true)));}
$('qs').onclick=loadMine;
$('addf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
 const r=await api('POST','/api/items',{title:f.get('title'),creator:f.get('creator'),year:f.get('year'),
  kind:f.get('kind'),rating:+f.get('rating'),shelf:f.get('shelf'),notes:f.get('notes'),pub:f.get('pub')?1:0});
 if(r.error)return alert(r.error);e.target.reset();document.querySelector('nav [data-t=mine]').click();loadMine();};
async function discover(){
 const p=new URLSearchParams({q:$('fq').value});if($('ff').value)p.set('kind',$('ff').value);
 const r=await api('GET','/api/discover?'+p);
 $('found').innerHTML=r.items.length?'':'<p class="muted">No public shelves match.</p>';
 r.items.forEach(it=>$('found').appendChild(card(it,false)));}
$('fs').onclick=discover;
async function openUser(name){
 const r=await api('GET','/api/u/'+encodeURIComponent(name));
 if(r.error)return;document.querySelector('nav [data-t=find]').click();
 $('fq').value='';$('found').innerHTML=`<p style="width:100%">📚 <b>${name}</b>'s public shelf (${r.items.length})</p>`;
 r.items.forEach(it=>$('found').appendChild(card(it,false)));}
refresh();
</script>
</body>
</html>
